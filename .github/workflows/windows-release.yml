name: Windows CLI Release

on:
    workflow_dispatch:
    push:
        tags:
            - "v*"

permissions:
    contents: read

jobs:
    windows-release:
        name: Build portable Windows CLI
        runs-on: windows-latest
        permissions:
            contents: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Use Node.js 24
              uses: actions/setup-node@v7
              with:
                  node-version: 24

            - name: Install pnpm
              uses: pnpm/action-setup@v6
              with:
                  version: 11.3.0

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build workspace
              run: pnpm run build

            - name: Create portable deployment
              shell: pwsh
              run: |
                  pnpm --filter "@yume-chan/adb-cli" --prod deploy --legacy dist/tango-cli

                  $nodePath = (Get-Command node).Source
                  Copy-Item $nodePath "dist/tango-cli/node.exe"

                  @'
                  @echo off
                  "%~dp0node.exe" "%~dp0esm/index.js" %*
                  '@ | Set-Content -Encoding ascii "dist/tango-cli/tango-cli.cmd"

                  @'
                  Tango CLI - portable Windows build

                  Run tango-cli.cmd from Command Prompt or PowerShell.
                  This package includes its own Node.js runtime; Node.js, npm,
                  and pnpm do not need to be installed separately.

                  A native Google ADB server must already be running on this computer.
                  '@ | Set-Content -Encoding utf8 "dist/tango-cli/README.txt"

                  Compress-Archive -Path "dist/tango-cli/*" -DestinationPath "dist/tango-cli-windows-x64.zip"

            - name: Upload workflow artifact
              if: github.event_name == 'workflow_dispatch'
              uses: actions/upload-artifact@v4
              with:
                  name: tango-cli-windows-x64
                  path: dist/tango-cli/
                  if-no-files-found: error

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ github.event_name == 'workflow_dispatch' && format('windows-build-{0}', github.run_number) || github.ref_name }}
                  target_commitish: ${{ github.sha }}
                  name: ${{ github.event_name == 'workflow_dispatch' && format('Windows CLI Build {0}', github.run_number) || github.ref_name }}
                  files: dist/tango-cli-windows-x64.zip
                  generate_release_notes: true
